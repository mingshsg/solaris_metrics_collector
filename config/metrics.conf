# Metrics collector configuration for Solaris 11 host metrics
# All values can be adjusted; file-only configuration (no env/CLI overrides)

# Target destination: elastic|logstash
TARGET="logstash"

# ============ Elasticsearch Cloud Configuration ============
# Uncomment and configure these when TARGET="elastic"

# Elastic Cloud HTTPS endpoint (base URL, no trailing slash)
ELASTIC_ENDPOINT="https://your-elastic-endpoint.com"

# Elastic API key (base64 encoded). Keep this file permissioned (chmod 600).
ELASTIC_API_KEY="APIKEY"

# TLS certificate validation: yes|no (default no)
ELASTIC_VALIDATE_CERT="no"


# ============ Logstash HTTP Input Configuration ============
# Uncomment and configure these when TARGET="logstash"

# Logstash HTTP input endpoint (host:port)
LOGSTASH_HOST="logstash_ip"
LOGSTASH_PORT="logstash_port"
LOGSTASH_PROTOCOL="http"

# TLS certificate validation: yes|no (default no)
LOGSTASH_VALIDATE_CERT="no"


# ============ Data Stream Configuration ============
DATA_STREAM_TYPE="metrics"
DATA_STREAM_DATASET="solaris.host"
DATA_STREAM_NAMESPACE="what"

# Collection interval hint (seconds). Use with cron or wrappers; default 30s.
COLLECTION_INTERVAL_SECONDS=30

# Enable/disable category collectors (cpu|memory|disk)
ENABLE_CPU="yes"
ENABLE_MEMORY="yes"
ENABLE_DISK="yes"

# HTTP client settings
HTTP_TIMEOUT_SECONDS=10
HTTP_RETRIES=5
HTTP_MAX_BACKOFF_SECONDS=60

# Logging level: ERROR|WARN|INFO|DEBUG (default INFO)
LOG_LEVEL="INFO"

# Offline buffer: enabled, path, and max size in MB (ndjson format)
BUFFER_ENABLED="yes"
BUFFER_PATH="/var/tmp/metrics_cache.ndjson"
BUFFER_MAX_MB=50

# Dry-run mode prints ECS payload and skips HTTP send: yes|no
DRY_RUN="no"

# Disk filesystem types to exclude (space-separated, matched exactly)
EXCLUDE_FS_TYPES="nfs nfs3 nfs4 smbfs autofs lofs proc mntfs ctfs objfs sharefs tmpfs devfs fdesc"

# Host identifier mode (fixed to short hostname per requirement)
HOST_ID_MODE="hostname"
